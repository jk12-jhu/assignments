<!doctype html>
<html lang="en">
  <head>
    <title>Lunch Checker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="styles/bootstrap.min.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body ng-app="LunchCheck" ng-controller="LunchCheckController">
    <div class="container">
      <h1>Lunch Checker</h1>

      <div class="form-group">
        <label>
          Enter comma-separated list of dishes. Empty items will not be counted!
          <input
            type="text"
            placeholder="list comma separated dishes you usually have for lunch"
            class="form-control"
            ng-model="dishes"
            ng-class="inputClass"
          />
        </label>
      </div>
      <div class="form-group">
        <button class="btn btn-default" ng-click="check()">Check If Too Much</button>
      </div>
      <div class="form-group message" ng-class="messageClass">
        {{ message }}
      </div>
    </div>

    <script src="angular.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
